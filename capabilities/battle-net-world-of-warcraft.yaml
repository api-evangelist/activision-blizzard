        method: GET
        description: Activision Blizzard Get WoW Character Achievements
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: realmSlug
          in: path
          type: string
          description: The realm slug
          required: true
        - name: characterName
          in: path
          type: string
          description: The character name
          required: true
        - name: namespace
          in: query
          type: string
          description: The namespace for the data
          required: true
