      path: /data/wow/guild/{realmSlug}/{nameSlug}
      operations:
      - name: getwowguild
        method: GET
        description: Activision Blizzard Get WoW Guild
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: realmSlug
          in: path
          type: string
          description: The realm slug
          required: true
        - name: nameSlug
          in: path
          type: string
          description: The guild name slug
          required: true
        - name: namespace
          in: query
          type: string
          description: The namespace for the data
          required: true
    - name: data-wow-item-itemId
      path: /data/wow/item/{itemId}
      operations:
      - name: getwowitem
        method: GET
        description: Activision Blizzard Get WoW Item
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: itemId
          in: path
          type: integer
          description: The item ID
          required: true
        - name: namespace
          in: query
          type: string
          description: The namespace for the data
          required: true
    - name: data-wow-realm-index
      path: /data/wow/realm/index
      operations:
      - name: getwowrealmsindex
        method: GET
        description: Activision Blizzard Get WoW Realms Index
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: namespace
          in: query
          type: string
          description: The namespace for the data
          required: true
        - name: locale
          in: query
          type: string
          description: Response locale
    - name: data-wow-realm-realmSlug
      path: /data/wow/realm/{realmSlug}
      operations:
      - name: getwowrealm
        method: GET
        description: Activision Blizzard Get WoW Realm
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: realmSlug
          in: path
          type: string
          description: The realm slug
          required: true
        - name: namespace
          in: query
          type: string
          description: The namespace for the data
          required: true
    - name: profile-user-wow
      path: /profile/user/wow
      operations:
      - name: getwowprofilesummary
        method: GET
        description: Activision Blizzard Get WoW Profile Summary
        outputRawFormat: json
