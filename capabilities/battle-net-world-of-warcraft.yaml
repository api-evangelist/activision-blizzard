          in: path
          type: string
          description: The realm slug
          required: true
        - name: characterName
          in: path
          type: string
          description: The lowercase character name
          required: true
        - name: namespace
          in: query
          type: string
          description: The namespace for the data
          required: true
        - name: locale
          in: query
          type: string
