      operations:
      - method: GET
        name: getwowguild
        description: Activision Blizzard Get WoW Guild
        call: battle-net-world-of-warcraft.getwowguild
        with:
          realmSlug: rest.realmSlug
          nameSlug: rest.nameSlug
          namespace: rest.namespace
        outputParameters:
        - type: object
          mapping: $.
