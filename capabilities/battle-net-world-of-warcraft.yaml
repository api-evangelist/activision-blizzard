naftiko: 1.0.0-alpha2
info:
  label: Activision Blizzard Battle.net API — World of Warcraft
  description: 'Activision Blizzard Battle.net API — World of Warcraft. 8 operations. Lead operation: Activision Blizzard
    Get WoW Guild. Self-contained Naftiko capability covering one Activision Blizzard business surface.'
  tags:
  - Activision Blizzard
  - World of Warcraft
  created: '2026-05-19'
  modified: '2026-05-19'
binds:
- namespace: env
  keys:
    ACTIVISION_BLIZZARD_API_KEY: ACTIVISION_BLIZZARD_API_KEY
