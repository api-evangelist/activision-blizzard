naftiko: "1.0.0-alpha1"

info:
  label: "Activision Blizzard Battle.net API"
  description: "Game data and profile APIs for World of Warcraft, Diablo III, Hearthstone, StarCraft II, and Battle.net account information."
  tags:
    - Activision Blizzard
    - Battle.net
    - Gaming
    - World of Warcraft
    - Hearthstone
  created: "2026-04-19"
  modified: "2026-04-19"

binds:
  - namespace: env
    keys:
      BATTLENET_CLIENT_ID: BATTLENET_CLIENT_ID
      BATTLENET_CLIENT_SECRET: BATTLENET_CLIENT_SECRET
      BATTLENET_ACCESS_TOKEN: BATTLENET_ACCESS_TOKEN

capability:
  consumes:
    - type: http
      namespace: battle-net
      baseUri: "https://us.api.blizzard.com"
      description: "Battle.net US region API"
      authentication:
        type: bearer
        token: "{{BATTLENET_ACCESS_TOKEN}}"
      resources:
        - name: wow-character
          path: /profile/wow/character
          description: "World of Warcraft character data"
          operations:
            - name: get-character
              method: GET
              description: "Get a WoW character profile"
              inputParameters:
                - name: realmSlug
                  in: path
                  type: string
                  required: true
                  description: "Realm slug"
                - name: characterName
                  in: path
                  type: string
                  required: true
                  description: "Character name"
                - name: namespace
                  in: query
                  type: string
                  required: true
                  description: "Namespace (e.g. profile-us)"
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: "$."
            - name: get-character-achievements
              method: GET
              description: "Get character achievements"
              inputParameters:
                - name: realmSlug
                  in: path
                  type: string
                  required: true
                  description: "Realm slug"
                - name: characterName
                  in: path
                  type: string
                  required: true
                  description: "Character name"
                - name: namespace
                  in: query
                  type: string
                  required: true
                  description: "Namespace"
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: "$."
        - name: wow-realm
          path: /data/wow/realm
          description: "World of Warcraft realm data"
          operations:
            - name: get-realms-index
              method: GET
              description: "Get index of all WoW realms"
              inputParameters:
                - name: namespace
                  in: query
                  type: string
                  required: true
                  description: "Namespace (e.g. dynamic-us)"
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: "$."
        - name: hearthstone-cards
          path: /hearthstone/cards
          description: "Hearthstone card data"
          operations:
            - name: search-cards
              method: GET
              description: "Search Hearthstone cards"
              inputParameters:
                - name: set
                  in: query
                  type: string
                  required: false
                  description: "Card set filter"
                - name: class
                  in: query
                  type: string
                  required: false
                  description: "Class filter"
                - name: manaCost
                  in: query
                  type: integer
                  required: false
                  description: "Mana cost filter"
                - name: page
                  in: query
                  type: integer
                  required: false
                  description: "Page number"
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: "$."
            - name: get-card
              method: GET
              description: "Get a specific Hearthstone card"
              inputParameters:
                - name: idOrSlug
                  in: path
                  type: string
                  required: true
                  description: "Card ID or slug"
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: "$."
        - name: diablo-profile
          path: /d3/profile
          description: "Diablo III profile data"
          operations:
            - name: get-career-profile
              method: GET
              description: "Get a Diablo III career profile"
              inputParameters:
                - name: battletag
                  in: path
                  type: string
                  required: true
                  description: "Player BattleTag"
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: "$."

  exposes:
    - type: rest
      port: 8100
      namespace: battle-net-rest
      resources:
        - path: /v1/wow/characters/{realmSlug}/{characterName}
          name: wow-character
          description: "WoW character data"
          operations:
            - method: GET
              name: get-character
              description: "Get WoW character"
              call: "battle-net.get-character"
              outputParameters:
                - type: object
                  mapping: "$."
        - path: /v1/hearthstone/cards
          name: hearthstone-cards
          description: "Hearthstone cards"
          operations:
            - method: GET
              name: search-cards
              description: "Search cards"
              call: "battle-net.search-cards"
              outputParameters:
                - type: object
                  mapping: "$."

    - type: mcp
      port: 9100
      namespace: battle-net-mcp
      transport: http
      tools:
        - name: get-wow-character
          description: "Get a World of Warcraft character profile"
          hints:
            readOnly: true
            openWorld: true
          call: "battle-net.get-character"
          outputParameters:
            - type: object
              mapping: "$."
        - name: get-wow-character-achievements
          description: "Get achievements for a WoW character"
          hints:
            readOnly: true
            openWorld: true
          call: "battle-net.get-character-achievements"
          outputParameters:
            - type: object
              mapping: "$."
        - name: search-hearthstone-cards
          description: "Search Hearthstone cards by class, set, or mana cost"
          hints:
            readOnly: true
            openWorld: true
          call: "battle-net.search-cards"
          outputParameters:
            - type: object
              mapping: "$."
        - name: get-hearthstone-card
          description: "Get a specific Hearthstone card by ID or slug"
          hints:
            readOnly: true
            openWorld: false
          call: "battle-net.get-card"
          outputParameters:
            - type: object
              mapping: "$."
        - name: get-diablo-career-profile
          description: "Get a Diablo III career profile by BattleTag"
          hints:
            readOnly: true
            openWorld: true
          call: "battle-net.get-career-profile"
          outputParameters:
            - type: object
              mapping: "$."
        - name: get-wow-realms
          description: "Get list of World of Warcraft realms"
          hints:
            readOnly: true
            openWorld: true
          call: "battle-net.get-realms-index"
          outputParameters:
            - type: object
              mapping: "$."
