naftiko: 1.0.0-alpha2
info:
  label: Activision Blizzard Game Data
  description: Unified game data workflow for accessing World of Warcraft characters, realms, guilds, items, Hearthstone cards,
    Diablo III profiles, and StarCraft II ladder data. Used by game developers, community app builders, and gaming analytics
    teams.
  tags:
  - Activision Blizzard
  - Battle.net
  - Gaming
  - World of Warcraft
  - Hearthstone
  - Diablo
  - StarCraft
  created: '2026-04-19'
  modified: '2026-05-06'
binds:
- namespace: env
  keys:
    BATTLENET_CLIENT_ID: BATTLENET_CLIENT_ID
    BATTLENET_CLIENT_SECRET: BATTLENET_CLIENT_SECRET
    BATTLENET_ACCESS_TOKEN: BATTLENET_ACCESS_TOKEN
capability:
  consumes:
  - type: http
    namespace: battle-net
    baseUri: https://us.api.blizzard.com
    description: Battle.net US region API
    authentication:
      type: bearer
      token: '{{BATTLENET_ACCESS_TOKEN}}'
    resources:
    - name: wow-character
      path: /profile/wow/character
      description: World of Warcraft character data
      operations:
      - name: get-character
        method: GET
        description: Get a WoW character profile
        inputParameters:
        - name: realmSlug
          in: path
          type: string
          required: true
          description: Realm slug
        - name: characterName
          in: path
          type: string
          required: true
          description: Character name
        - name: namespace
          in: query
          type: string
          required: true
          description: Namespace (e.g. profile-us)
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
      - name: get-character-achievements
        method: GET
        description: Get character achievements
        inputParameters:
        - name: realmSlug
          in: path
          type: string
          required: true
          description: Realm slug
        - name: characterName
          in: path
          type: string
          required: true
          description: Character name
        - name: namespace
          in: query
          type: string
          required: true
          description: Namespace
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
    - name: wow-realm
      path: /data/wow/realm
      description: World of Warcraft realm data
      operations:
      - name: get-realms-index
        method: GET
        description: Get index of all WoW realms
        inputParameters:
        - name: namespace
          in: query
          type: string
          required: true
          description: Namespace (e.g. dynamic-us)
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
    - name: hearthstone-cards
      path: /hearthstone/cards
      description: Hearthstone card data
      operations:
      - name: search-cards
        method: GET
        description: Search Hearthstone cards
        inputParameters:
        - name: set
          in: query
          type: string
          required: false
          description: Card set filter
        - name: class
          in: query
          type: string
          required: false
          description: Class filter
        - name: manaCost
          in: query
          type: integer
          required: false
          description: Mana cost filter
        - name: page
          in: query
          type: integer
          required: false
          description: Page number
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
      - name: get-card
        method: GET
        description: Get a specific Hearthstone card
        inputParameters:
        - name: idOrSlug
          in: path
          type: string
          required: true
          description: Card ID or slug
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
    - name: diablo-profile
      path: /d3/profile
      description: Diablo III profile data
      operations:
      - name: get-career-profile
        method: GET
        description: Get a Diablo III career profile
        inputParameters:
        - name: battletag
          in: path
          type: string
          required: true
          description: Player BattleTag
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
  exposes:
  - type: rest
    port: 8080
    namespace: game-data-api
    description: Unified REST API for Activision Blizzard game data.
    resources:
    - path: /v1/wow/characters/{realmSlug}/{characterName}
      name: wow-characters
      description: World of Warcraft character data
      operations:
      - method: GET
        name: get-wow-character
        description: Get a WoW character profile
        call: battle-net.get-character
        with:
          realmSlug: rest.realmSlug
          characterName: rest.characterName
        outputParameters:
        - type: object
          mapping: $.
    - path: /v1/wow/realms
      name: wow-realms
      description: World of Warcraft realms
      operations:
      - method: GET
        name: get-wow-realms
        description: Get WoW realm list
        call: battle-net.get-realms-index
        outputParameters:
        - type: object
          mapping: $.
    - path: /v1/hearthstone/cards
      name: hearthstone-cards
      description: Hearthstone card data
      operations:
      - method: GET
        name: search-hearthstone-cards
        description: Search Hearthstone cards
        call: battle-net.search-cards
        outputParameters:
        - type: object
          mapping: $.
    - path: /v1/diablo/profiles/{battletag}
      name: diablo-profiles
      description: Diablo III profiles
      operations:
      - method: GET
        name: get-diablo-profile
        description: Get Diablo III career profile
        call: battle-net.get-career-profile
        with:
          battletag: rest.battletag
        outputParameters:
        - type: object
          mapping: $.
  - type: mcp
    port: 9090
    namespace: game-data-mcp
    transport: http
    description: MCP server for AI-assisted access to Activision Blizzard game data.
    tools:
    - name: get-wow-character
      description: Get a World of Warcraft character profile including level, class, race, guild, and achievement points
      hints:
        readOnly: true
        openWorld: true
      call: battle-net.get-character
      with:
        realmSlug: tools.realmSlug
        characterName: tools.characterName
      outputParameters:
      - type: object
        mapping: $.
    - name: get-wow-character-achievements
      description: Get the achievements completed by a World of Warcraft character
      hints:
        readOnly: true
        openWorld: true
      call: battle-net.get-character-achievements
      with:
        realmSlug: tools.realmSlug
        characterName: tools.characterName
      outputParameters:
      - type: object
        mapping: $.
    - name: get-wow-realms
      description: Get the list of World of Warcraft realms
      hints:
        readOnly: true
        openWorld: true
      call: battle-net.get-realms-index
      outputParameters:
      - type: object
        mapping: $.
    - name: search-hearthstone-cards
      description: Search Hearthstone cards by class, set, mana cost, or other criteria
      hints:
        readOnly: true
        openWorld: true
      call: battle-net.search-cards
      with:
        class: tools.class
        set: tools.set
        manaCost: tools.manaCost
      outputParameters:
      - type: object
        mapping: $.
    - name: get-hearthstone-card
      description: Get a specific Hearthstone card by ID or slug
      hints:
        readOnly: true
        openWorld: false
      call: battle-net.get-card
      with:
        idOrSlug: tools.idOrSlug
      outputParameters:
      - type: object
        mapping: $.
    - name: get-diablo-career-profile
      description: Get a Diablo III career profile for a BattleTag account
      hints:
        readOnly: true
        openWorld: true
      call: battle-net.get-career-profile
      with:
        battletag: tools.battletag
      outputParameters:
      - type: object
        mapping: $.
