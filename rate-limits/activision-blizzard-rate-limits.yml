description: Battle.net API limits are bound to the OAuth2 client (registered at develop.battle.net).
  Numerical limits are documented in the Battle.net Community Developer Portal's API guidelines; the
  default per-client allowance is widely cited as 100 requests per second / 36,000 requests per hour.
  Higher limits are granted on application via the developer portal forums.
sources:
  - https://develop.battle.net/
  - https://community.developer.battle.net/documentation
notes: Numerical defaults reflect the long-standing public Battle.net developer guidelines but the live
  documentation site is JavaScript-rendered and exact values can change; reconciled flag is false until
  the documentation is verified directly against the live guidelines page.
responseCodes:
  throttled: 429
limits:
  - name: Battle.net API per-second
    scope: oauth-client
    metric: requests_per_second
    limit: 100
    timeFrame: second
    notes: Default per-client cap historically published in the Battle.net developer guidelines.
  - name: Battle.net API per-hour
    scope: oauth-client
    metric: requests_per_hour
    limit: 36000
    timeFrame: hour
    notes: Default per-client cap historically published in the Battle.net developer guidelines.
policies:
  - name: OAuth2 Client-Scoped
    description: Limits are tracked per OAuth2 client registered through develop.battle.net; multiple
      tokens issued to the same client share the allowance.
  - name: Backoff
    description: On 429 responses, back off and retry; respect any Retry-After header returned.
  - name: Limit Increase
    description: Higher limits can be requested through the developer portal forums; commercial usage
      typically requires a direct agreement with Blizzard.
  - name: Region Endpoints
    description: Use the regional API host that matches your client (us, eu, kr, tw); cross-region calls
      do not pool quota.
maintainers:
