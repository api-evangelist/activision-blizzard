description: FOCUS-aligned FinOps scaffold for Activision Blizzard's Battle.net API. There is no Blizzard
  invoice for non-commercial use; FinOps relevance is restricted to compute/egress costs incurred by
  the integrating application when polling Battle.net data and to any commercial-licence fee negotiated
  directly with Blizzard.
sources:
  - https://develop.battle.net/
  - https://community.developer.battle.net/
notes: No published commercial billing model. Reconciled flag is false because there is no provider
  invoice to map to FOCUS columns.
billingModel:
  pricingCategory: Free (Non-Commercial) / Negotiated Commercial Licence
  billingFrequency: Annual
  billingCurrency: USD
  chargeCategories:
    - Purchase
