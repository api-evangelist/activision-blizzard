meters:
  - name: api_request
    description: Battle.net API request consumed against per-OAuth-client limits. Not directly billed
      under the free developer tier, but the unit consumers track for cost-of-integration analysis.
    unit: request
    aggregation: sum
    dimensions:
      - region
      - game
      - endpoint
  - name: commercial_licence
    description: Annual commercial-licence fee for Battle.net API use, where contracted.
    unit: year
    aggregation: sum
    dimensions:
      - tier
principles:
  - name: Visibility
    description: There is no Blizzard usage API. Track outbound calls by OAuth2 client at the consumer's
      egress / API gateway and watch for 429 responses as the practical "approaching budget" signal.
  - name: Allocation
    description: Allocate compute and egress costs of polling Battle.net data to the consuming product
      (e.g. guild website, leaderboard service, esports backend) rather than to Blizzard.
  - name: Optimization
    description: Cache aggressively, prefer scheduled batch refreshes over on-demand calls, share OAuth
      clients only when limits permit, and use change-aware patterns where exposed.
  - name: Accountability
    description: The integrator's engineering team owns rate-limit headroom and any commercial-licence
      renewal.
