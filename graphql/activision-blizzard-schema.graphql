  name: String!
  class: String!
  gender: String!
  level: Int!
  hardcore: Boolean!
  seasonal: Boolean!
  dead: Boolean!
  paragonLevel: Int!
  kills: DiabloKills!
  items: DiabloItems
  skills: DiabloSkills
