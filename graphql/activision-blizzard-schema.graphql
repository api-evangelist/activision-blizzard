type DiabloKills {
  monsters: Int!
  elites: Int!
  hardcoreMonsters: Int
}

type DiabloTimePlayed {
  barbarian: Float
  crusader: Float
  demonHunter: Float
  monk: Float
  necromancer: Float
  witchDoctor: Float
  wizard: Float
}

type DiabloItems {
  head: DiabloItem
  torso: DiabloItem
  feet: DiabloItem
  hands: DiabloItem
  shoulders: DiabloItem
  legs: DiabloItem
  bracers: DiabloItem
  mainHand: DiabloItem
  offHand: DiabloItem
  ring1: DiabloItem
  ring2: DiabloItem
  amulet: DiabloItem
}

type DiabloItem {
  id: ID!
  name: String!
  displayColor: String
  icon: String
  tooltipParams: String
}

type DiabloSkills {
  active: [DiabloSkill!]!
  passive: [DiabloSkill!]!
}

type DiabloSkill {
  slug: String!
  name: String!
  description: String!
  categorySlug: String
  rune: DiabloRune
}

type DiabloRune {
