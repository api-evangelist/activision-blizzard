  totalSwarmLevel: Int
  totalAchievementPoints: Int
}

type SC2Ladder {
  id: ID!
  name: String!
  localizedGameMode: String!
  wins: Int!
  losses: Int!
  ties: Int!
  mmr: Int
  points: Int!
  rank: Int
  league: String!
