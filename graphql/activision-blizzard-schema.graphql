# ─────────────────────────────────────────
# Hearthstone
# ─────────────────────────────────────────

type HearthstoneCard {
  id: ID!
  name: String!
  text: String
  flavorText: String
  cardTypeId: Int
  cardSetId: Int
  classId: Int
  manaCost: Int!
  attack: Int
  health: Int
  durability: Int
  rarity: String!
  image: String
  imageGold: String
  cropImage: String
}

type HearthstoneCardSet {
  id: ID!
  name: String!
  slug: String!
  type: String!
  hyped: Boolean
  logo: String
}

type HearthstoneDeck {
  code: String!
  version: Int!
  format: String!
  hero: HearthstoneCard
  class: String!
  cards: [HearthstoneCard!]!
}

# ─────────────────────────────────────────
# Root Query & Mutations
# ─────────────────────────────────────────

type Query {
  # Auth
  oauthToken(clientId: String!, clientSecret: String!, region: Region!): OAuthToken
  battleNetAccount(token: String!): BattleNetAccount

  # Realms
  realm(realmSlug: String!, region: Region!): Realm
  realms(region: Region!): [Realm!]!
  connectedRealm(id: ID!, region: Region!): ConnectedRealm

  # WoW Characters
  wowCharacter(realmSlug: String!, characterName: String!, region: Region!): WoWCharacter
  characterProfile(realmSlug: String!, characterName: String!, region: Region!): CharacterProfile
  characterEquipment(realmSlug: String!, characterName: String!, region: Region!): CharacterEquipment
  characterStats(realmSlug: String!, characterName: String!, region: Region!): CharacterStats
  characterAchievements(realmSlug: String!, characterName: String!, region: Region!): [CharacterAchievement!]!
  characterTitles(realmSlug: String!, characterName: String!, region: Region!): [CharacterTitle!]!
  characterCollections(realmSlug: String!, characterName: String!, region: Region!): Collections
  characterPvP(realmSlug: String!, characterName: String!, region: Region!, bracket: String!): BracketRecord
  mythicKeystoneProfile(realmSlug: String!, characterName: String!, region: Region!): MythicKey

  # Guilds
  guild(realmSlug: String!, guildSlug: String!, region: Region!): Guild
  guildRoster(realmSlug: String!, guildSlug: String!, region: Region!): GuildRoster
  guildAchievements(realmSlug: String!, guildSlug: String!, region: Region!): [GuildAchievement!]!

  # Raids & Dungeons
  raid(raidSlug: String!, region: Region!): Raid
  raids(region: Region!, expansion: String): [Raid!]!
  dungeon(dungeonId: ID!, region: Region!): Dungeon
  dungeons(region: Region!): [Dungeon!]!
  keystoneAffixes(region: Region!): AffixSet

  # Items
  item(itemId: ID!, region: Region!): WoWItem
  itemSet(setId: ID!, region: Region!): ItemSet

  # CoD
  codProfile(username: String!, platform: String!): CoDProfile
  codMatch(matchId: ID!): CoDMatch
  warzoneStats(username: String!, platform: String!): WarzoneStats
  warzoneMatch(matchId: ID!): WarzoneMatch

  # Overwatch
  owProfile(battletag: String!, platform: String!): OWProfile
  owHero(heroId: ID!): OWHero
  owHeroes: [OWHero!]!

  # Diablo III
  diabloProfile(region: Region!, battleTag: String!): DiabloProfile
  diabloHero(region: Region!, accountId: String!, heroId: ID!): DiabloHero

  # StarCraft II
  sc2Profile(region: Region!, realmId: Int!, profileId: ID!): SC2Profile
  sc2Ladder(region: Region!, ladderId: ID!): SC2Ladder

  # Hearthstone
  hearthstoneCard(id: ID!, region: Region!): HearthstoneCard
  hearthstoneCards(classSlug: String, setSlug: String, manaCost: Int, rarity: String, region: Region): [HearthstoneCard!]!
  hearthstoneDeck(code: String!, region: Region!): HearthstoneDeck
  hearthstoneCardSets(region: Region!): [HearthstoneCardSet!]!
}

type Mutation {
  # No public write endpoints; mutations are placeholders for potential future operations
  refreshOAuthToken(refreshToken: String!, clientId: String!, region: Region!): OAuthToken
}
